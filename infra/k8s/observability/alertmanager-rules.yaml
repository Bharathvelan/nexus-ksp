###############################################################################
# Alertmanager Rules
###############################################################################
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nexus-ksp-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: service_health
      rules:
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{status=~"5.."}[2m])) by (service) / sum(rate(http_requests_total[2m])) by (service) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: High error rate on {{ $labels.service }}
            description: "{{ $labels.service }} has an error rate > 5% for 2 minutes."

        - alert: HighLatency
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High P95 latency on {{ $labels.service }}
            description: "{{ $labels.service }} P95 latency is > 10s for 5 minutes."

    - name: infrastructure_health
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="nexus-ksp"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Pod {{ $labels.pod }} is crash looping
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting repeatedly."

        - alert: HighDatabaseConnections
          expr: pg_stat_activity_count > (pg_settings_max_connections * 0.8)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: High database connections
            description: "PostgreSQL connections are > 80% of max capacity."

        - alert: KafkaConsumerLag
          expr: sum(kafka_consumergroup_lag) by (consumergroup) > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High Kafka consumer lag for {{ $labels.consumergroup }}
            description: "Consumer group {{ $labels.consumergroup }} lag is > 10,000 messages."

        - alert: HighDiskUsage
          expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 80
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: High disk usage on {{ $labels.instance }}
            description: "Disk usage is > 80% on {{ $labels.instance }}."
