###############################################################################
# NEXUS-KSP Namespace + Resource Quotas
###############################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-ksp
  labels:
    name: nexus-ksp
    environment: production
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nexus-ksp-quota
  namespace: nexus-ksp
spec:
  hard:
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
    pods: "100"
    services: "50"
    persistentvolumeclaims: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: nexus-ksp-limits
  namespace: nexus-ksp
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: 2000m
        memory: 4Gi
      max:
        cpu: "4"
        memory: 8Gi
