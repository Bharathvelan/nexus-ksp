###############################################################################
# alert-service — All Manifests
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: nexus-ksp
  labels:
    app: alert-service
    role: backend-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: alert-service
        role: backend-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: alert-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: alert-service
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: alert-service
              topologyKey: kubernetes.io/hostname
      containers:
        - name: alert-service
          image: "${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/nexus-ksp/alert-service:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: alert-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-db-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-cache-secrets
                  key: redis-url
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: shared-kafka-secrets
                  key: bootstrap-brokers
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: alert-service-secrets
                  key: twilio-account-sid
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alert-service-secrets
                  key: twilio-auth-token
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: nexus-ksp
  labels:
    app: alert-service
spec:
  type: ClusterIP
  selector:
    app: alert-service
  ports:
    - name: http
      port: 8005
      targetPort: 8005
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alert-service-hpa
  namespace: nexus-ksp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alert-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-service-config
  namespace: nexus-ksp
data:
  PORT: "8005"
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  OTEL_SERVICE_NAME: "alert-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.monitoring:4317"
  KAFKA_TOPIC_ALERTS: "nexus-alerts"
  KAFKA_CONSUMER_GROUP: "alert-service-group"
  ALERT_RETENTION_DAYS: "30"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-service-sa
  namespace: nexus-ksp
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/nexus-ksp-alert-service-role"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alert-service-secrets
  namespace: nexus-ksp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alert-service-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: twilio-account-sid
      remoteRef:
        key: nexus-ksp/production/alert-service
        property: twilio_account_sid
    - secretKey: twilio-auth-token
      remoteRef:
        key: nexus-ksp/production/alert-service
        property: twilio_auth_token
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alert-service-pdb
  namespace: nexus-ksp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alert-service
