###############################################################################
# llm-orchestrator — ConfigMap
###############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-orchestrator-config
  namespace: nexus-ksp
data:
  PORT: "8001"
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  WHISPER_MODEL: "openai/whisper-large-v3"
  INDIC_TRANS_MODEL: "ai4bharat/indictrans2-kn-en-1B"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  KAFKA_TOPIC_AI_EVENTS: "nexus-ai-events"
  KAFKA_CONSUMER_GROUP: "llm-orchestrator-group"
  OTEL_SERVICE_NAME: "llm-orchestrator"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.monitoring:4317"
  CACHE_TTL_SECONDS: "300"
  MAX_CONCURRENT_REQUESTS: "50"
  LLM_TIMEOUT_SECONDS: "120"
---
###############################################################################
# llm-orchestrator — ServiceAccount (for IRSA)
###############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-orchestrator-sa
  namespace: nexus-ksp
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/nexus-ksp-llm-orchestrator-role"
