###############################################################################
# report-exporter — All Manifests
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-exporter
  namespace: nexus-ksp
  labels:
    app: report-exporter
    role: backend-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-exporter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: report-exporter
        role: backend-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8007"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: report-exporter-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: report-exporter
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: report-exporter
              topologyKey: kubernetes.io/hostname
      containers:
        - name: report-exporter
          image: "${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/nexus-ksp/report-exporter:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8007
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: report-exporter-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-db-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-cache-secrets
                  key: redis-url
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: report-exporter
  namespace: nexus-ksp
  labels:
    app: report-exporter
spec:
  type: ClusterIP
  selector:
    app: report-exporter
  ports:
    - name: http
      port: 8007
      targetPort: 8007
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: report-exporter-hpa
  namespace: nexus-ksp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: report-exporter
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-exporter-config
  namespace: nexus-ksp
data:
  PORT: "8007"
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  OTEL_SERVICE_NAME: "report-exporter"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.monitoring:4317"
  EXPORTS_S3_BUCKET: "nexus-ksp-exports"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-exporter-sa
  namespace: nexus-ksp
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/nexus-ksp-report-exporter-role"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: report-exporter-pdb
  namespace: nexus-ksp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: report-exporter
