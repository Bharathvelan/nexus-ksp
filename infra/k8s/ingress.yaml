###############################################################################
# NEXUS-KSP — AWS ALB Ingress
# TLS termination with ACM, host-based routing, WAF association.
###############################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-ksp-ingress
  namespace: nexus-ksp
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERTIFICATE_ARN}"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/wafv2-acl-arn: "${WAF_WEB_ACL_ARN}"
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=60,
      routing.http2.enabled=true,
      access_logs.s3.enabled=true,
      access_logs.s3.bucket=nexus-ksp-audit-archive,
      access_logs.s3.prefix=alb-access-logs
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/group.name: nexus-ksp-alb-group
    alb.ingress.kubernetes.io/tags: >-
      Project=nexus-ksp,Environment=production,ManagedBy=kubernetes
spec:
  rules:
    # Main web dashboard
    - host: nexus-ksp.karnataka.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    # API gateway
    - host: api.nexus-ksp.karnataka.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
  tls:
    - hosts:
        - nexus-ksp.karnataka.gov.in
        - api.nexus-ksp.karnataka.gov.in
